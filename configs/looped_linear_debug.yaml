# Smoke test: tiny model, tiny task, runs in ~1-2 min on CPU.
# Use this to check the plumbing, not to reproduce any paper number.
run_name: debug_looped_linear
seed: 0
device: auto

task:
  name: linear        # linear | sparse_linear | decision_tree | mlp2
  d: 10

model:
  looped: true
  n_layer: 1          # the paper's looped model shares a single block
  n_head: 4
  n_embd: 64
  dropout: 0.0

train:
  steps: 120
  batch_size: 32
  lr: 1.0e-4
  k_max: 8
  curriculum_k: true
  n_loops: 6          # b in Eq. 1
  loss_window: 3      # T in Eq. 1
  schedule_b: true
  b_start: 1
  eval_every: 60
  grad_clip: 1.0e9

eval:
  batch_size: 128
  k: 8
  iterations: [1, 2, 4, 6, 8, 12]
