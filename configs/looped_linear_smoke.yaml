# Small-scale demo that actually learns in ~2 minutes on one GPU.
# Not a paper reproduction -- it exercises the full method (input injection,
# truncated window loss, loop extrapolation at eval time) at a size where the
# in-context solution is learnable.
#
# Expected (seed 0, verified on a single GPU, ~30 s):
#   b=1  ~0.88   (no context used, equals predicting the mean)
#   b=3  ~0.07   (trained b=3 -> learns the algorithm)
#   b=6  ~0.12   b=12 ~0.26   (degrades beyond the trained b: the paper's
#                              "b too small -> no robust fixed point", Fig.4)
#   OLS  ~1e-12
run_name: smoke_looped_linear
seed: 0
device: auto

task:
  name: linear
  d: 2               # low dimension so a 1-layer looped model learns fast
  # note: d=20 with k=40 (paper scale) needs 1e4-1e5 steps; see docs/05

model:
  looped: true
  n_layer: 1
  n_head: 4
  n_embd: 64
  dropout: 0.0

train:
  steps: 1500
  batch_size: 64
  lr: 1.0e-3
  k_max: 5
  curriculum_k: false
  n_loops: 3         # b
  loss_window: 2     # T -> loss window [1, 3]
  schedule_b: false
  eval_every: 500
  grad_clip: 1.0e9

eval:
  batch_size: 512
  k: 5
  iterations: [1, 3, 6, 12]   # 6 and 12 exceed the trained b on purpose
